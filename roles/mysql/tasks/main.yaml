- name: install mysql 
  ansible.builtin.dnf: 
    name: mysql-server
    state: present

- name: start & enable mysql
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: install mysql python libraries
  ansible.builtin.pip:
    executable: pip3.9
    name: "{{ item }}"
  loop:
  - botocore
  - boto3     

- name: setup root password
  ansible.builtin.shell:  mysql_secure_installation --set-root-pass {{ MYSQL_ROOT_PASSWORD }}
 