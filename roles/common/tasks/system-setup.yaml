- name: copy {{ component }} service files
  ansible.builtin.template:
    src: "{{ component }}.service.j2" 
    dest: "/etc/systemd/system/{{ component }}.service"
  notify: daemon_reload 


- name: start the service
  ansible.builtin.service:
    name: "{{ component }}"  
    state: restarted
    enabled: yes 




 